<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Анна Ивановская — портфолио</title>
  <meta name="description" content="Исследования · Координация · Креативные индустрии">
  <meta property="og:title" content="Анна Ивановская — портфолио">
  <meta property="og:description" content="Исследования · Координация · Креативные индустрии">
  <meta property="og:image" content="https://ivanovskaiaaanna.github.io/cv/img/portrait-color.webp">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#EDEDE8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%237A8B12'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Manrope:wght@400;500;600;700&family=PT+Mono&family=Unbounded:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="wave" viewBox="0 0 200 14" preserveAspectRatio="none">
        <path d="M2 8 C 18 2, 30 13, 46 7 S 76 2, 92 8 S 122 13, 138 7 S 168 2, 184 8 S 196 10, 198 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="oval" viewBox="0 0 220 80" preserveAspectRatio="none">
        <path d="M30 18 C 70 2, 170 2, 205 22 C 228 38, 200 70, 120 74 C 50 78, 6 64, 10 42 C 13 26, 40 14, 92 9 C 130 6, 168 8, 190 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="clip" viewBox="0 0 24 64">
        <path d="M8 40 V12 a4 4 0 0 1 8 0 V48 a7 7 0 0 1 -14 0 V16" fill="none" stroke="#8b8c84" stroke-width="2.2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <header class="top">
    <div class="top__inner wrap">
      <a class="top__name" href="#" data-i18n="heroName">Анна Ивановская</a>
      <nav class="top__nav" aria-label="Разделы">
        <a href="#about" data-nav="about">обо мне</a>
        <a href="#cases" data-nav="cases">кейсы</a>
        <a href="#contact" data-nav="contact">контакт</a>
      </nav>
      <div class="lang" role="group" aria-label="Язык">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- 1. Первый экран -->
    <section class="hero wrap" id="top">
      <figure class="hero__photo">
        <div class="polaroid polaroid--back">
          <div class="polaroid__img">
            <img src="img/portrait-bw.webp" alt="" width="1200" height="1510" data-fallback="keep">
          </div>
        </div>
        <div class="polaroid polaroid--hero">
          <svg class="clip" aria-hidden="true"><use href="#clip"/></svg>
          <div class="polaroid__img">
            <img src="img/portrait-color.webp" alt="" width="1200" height="1600" fetchpriority="high" data-fallback="keep">
          </div>
        </div>
        <figcaption class="note note--hero" id="hero-note"></figcaption>
      </figure>
      <div class="hero__text">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero__name" id="hero-name"></h1>
        <p class="hero__pos" id="hero-pos"></p>
        <p class="facts" id="hero-facts"></p>
      </div>
    </section>

    <!-- 2. Обо мне -->
    <section class="section wrap about" id="about">
      <h2 class="h2" data-i18n="about"></h2>
      <div class="about__grid">
        <div class="about__text" id="about-text"></div>
        <figure class="about__photo">
          <div class="polaroid polaroid--small">
            <div class="polaroid__img">
              <img src="img/portrait-street.webp" alt="" width="1000" height="1333" loading="lazy">
            </div>
          </div>
        </figure>
      </div>
    </section>

    <!-- 3. Что я делаю -->
    <section class="section wrap" id="what">
      <h2 class="h2" data-i18n="what"></h2>
      <ol class="what" id="what-list"></ol>
    </section>

    <!-- 4. Кейсы -->
    <section class="section wrap" id="cases">
      <h2 class="h2 h2--wave"><span data-i18n="cases"></span><svg class="wave" aria-hidden="true"><use href="#wave"/></svg></h2>
      <ul class="cards" id="cards"></ul>
    </section>

    <!-- 5. Опыт и учёба -->
    <section class="section wrap" id="experience">
      <h2 class="h2" data-i18n="exp"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- 6. Интересы -->
    <section class="section wrap" id="interests">
      <h2 class="h2" data-i18n="interests"></h2>
      <ul class="tags" id="tags"></ul>
    </section>

    <!-- 7. Контакт -->
    <section class="section wrap contact" id="contact">
      <h2 class="h2 h2--wave"><span data-i18n="contact"></span><svg class="wave" aria-hidden="true"><use href="#wave"/></svg></h2>
      <ul class="contact__list" id="contact-list"></ul>
    </section>
  </main>

  <!-- Страница кейса: панель на весь экран, у каждого кейса свой адрес #slug -->
  <div class="case" id="case" role="dialog" aria-modal="true" aria-labelledby="case-title" hidden>
    <div class="case__bar">
      <div class="case__bar-inner wrap">
        <button type="button" class="case__back" id="case-back"></button>
        <span class="case__count" id="case-count"></span>
        <div class="lang lang--case" role="group" aria-label="Язык">
          <button type="button" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="case__close" id="case-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="case__scroll" id="case-scroll">
      <article class="case__body wrap" id="case-body"></article>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
